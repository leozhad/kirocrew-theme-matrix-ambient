  // Share of the film's light that reaches the screen, in linear light.
  const GAIN = 0.03
  const FPS = 15
  // Canvas pixels per CSS pixel. Below 1 the browser scales the canvas up, which
  // softens the glyphs (they read as background) and cuts the per-frame cost.
  const SCALE = 0.5
  const LEVELS = 16
  // Film colours (4K UHD frames, see the repo README): body ramp and lead glyph.
  const FILM_RAMP = [
    [0.00, [0, 0, 0]],
    [0.15, [0, 38, 20]],
    [0.45, [2, 112, 66]],
    [0.75, [10, 165, 102]],
    [1.00, [14, 205, 128]],
  ]
  const FILM_LEAD = [236, 248, 253]

  const toLin = c => { c /= 255; return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4) }
  const toSrgb = l => Math.round(255 * (l <= 0.0031308 ? l * 12.92 : 1.055 * Math.pow(l, 1 / 2.4) - 0.055))
  const dim = rgb => rgb.map(c => toSrgb(toLin(c) * GAIN))
  const RAMP = FILM_RAMP.map(([x, c]) => [x, dim(c)])
  const LEAD = dim(FILM_LEAD)

  const canvas = document.getElementById('screen')
  const ctx = canvas.getContext('2d')
  const halo = document.createElement('canvas')
  const hctx = halo.getContext('2d')
  const wide = document.createElement('canvas')
  const wctx = wide.getContext('2d')

  const lerp = (a, b, t) => a + (b - a) * t
  function rampColor(b) {
    for (let i = 1; i < RAMP.length; i++) {
      const [x1, c1] = RAMP[i]
      const [x0, c0] = RAMP[i - 1]
      if (b <= x1) {
        const t = (b - x0) / (x1 - x0)
        return [0, 1, 2].map(k => Math.round(lerp(c0[k], c1[k], t)))
      }
    }
    return RAMP[RAMP.length - 1][1]
  }

  // The atlas is white on transparent, so source-in paints the shapes in `rgb`.
  function tint(img, rgb) {
    const c = document.createElement('canvas')
    c.width = img.width
    c.height = img.height
    const x = c.getContext('2d')
    x.drawImage(img, 0, 0)
    x.globalCompositeOperation = 'source-in'
    x.fillStyle = `rgb(${rgb[0]},${rgb[1]},${rgb[2]})`
    x.fillRect(0, 0, c.width, c.height)
    return c
  }

  let W = 0, H = 0
  let cellW = 18, cellH = 26, cols = 0, rows = 0
  let grid = null, timers = null, columns = []

  function layout() {
    // 1x canvas: a soft background needs no more, and it keeps the CPU cool.
    W = Math.max(1, window.innerWidth)
    H = Math.max(1, window.innerHeight)
    canvas.width = Math.max(1, Math.round(W * SCALE))
    canvas.height = Math.max(1, Math.round(H * SCALE))
    ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0)
    halo.width = Math.max(1, Math.round(W / 4))
    halo.height = Math.max(1, Math.round(H / 4))
    wide.width = Math.max(1, Math.round(W / 10))
    wide.height = Math.max(1, Math.round(H / 10))
    // Film grid: ~53 columns at 1280 px, glyph ink ~20x28 px in a ~24x34 px cell.
    cellW = Math.max(14, Math.min(30, Math.round(W / 53)))
    cellH = Math.round(cellW * 1.42)
    cols = Math.ceil(W / cellW)
    rows = Math.ceil(H / cellH) + 1
    grid = new Uint8Array(cols * rows)
    timers = new Float32Array(cols * rows)
    for (let i = 0; i < grid.length; i++) {
      grid[i] = (Math.random() * RAIN.count) | 0
      timers[i] = Math.random() * 6
    }
    columns = []
    for (let c = 0; c < cols; c++) columns.push(newColumn())
  }

  function newColumn() {
    // About a fifth of the screensaver's speed, with shorter trails and
    // longer gaps, so about half as many glyphs are lit at once.
    const period = rows * (2.2 + Math.random() * 2.6)
    return {
      speed: 1.6 + Math.random() * 2,
      period,
      trail: period * (0.3 + Math.random() * 0.25),
      phase: Math.random() * period,
      gain: 0.7 + Math.random() * 0.3,
      lead: Math.random() < 0.6,
    }
  }

  const leads = []
  function drawRain(dt, now, levels, lead, gw, gh) {
    leads.length = 0
    for (let c = 0; c < cols; c++) {
      const col = columns[c]
      const head = now * col.speed + col.phase
      const x = c * cellW + (cellW - gw) / 2
      for (let r = 0; r < rows; r++) {
        let d = (head - r) % col.period
        if (d < 0) d += col.period
        const i = c * rows + r
        timers[i] -= dt
        let b
        if (d < 1) b = col.lead ? 2 : col.gain
        else if (d < col.trail) b = Math.pow(1 - d / col.trail, 0.6) * col.gain
        else continue
        if (b < 0.14) continue
        if (timers[i] <= 0) {
          grid[i] = (Math.random() * RAIN.count) | 0
          timers[i] = 1 + Math.random() * (b > 1 ? 0.8 : 5)
        }
        const g = grid[i]
        const sx = (g % RAIN.cols) * RAIN.cell
        const sy = Math.floor(g / RAIN.cols) * RAIN.cell
        const y = r * cellH + (cellH - gh) / 2
        const src = b > 1 ? lead : levels[Math.min(LEVELS - 1, Math.max(0, Math.round(b * (LEVELS - 1))))]
        ctx.drawImage(src, sx, sy, RAIN.cell, RAIN.cell, x, y, gw, gh)
        if (b > 1) leads.push(sx, sy, x, y)
      }
    }
  }

  // Soft bloom: shrink the frame twice (smoothing blurs it) and add it back.
  function bloom() {
    hctx.globalCompositeOperation = 'copy'
    hctx.drawImage(canvas, 0, 0, halo.width, halo.height)
    wctx.globalCompositeOperation = 'copy'
    wctx.drawImage(halo, 0, 0, wide.width, wide.height)
    ctx.save()
    ctx.globalCompositeOperation = 'lighter'
    ctx.imageSmoothingEnabled = true
    ctx.globalAlpha = 0.3
    ctx.drawImage(halo, 0, 0, W, H)
    ctx.globalAlpha = 0.25
    ctx.drawImage(wide, 0, 0, W, H)
    ctx.restore()
  }

  // Host state: Kiro Crew posts {type: 'theme:state', mode, reducedMotion} on
  // load and on every change. Nothing draws until the first one arrives. The
  // listener goes on now, before the atlas decodes, so the first post is kept.
  let mode = null
  let hostReduced = false
  let update = () => {}
  const osReduced = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null
  const bench = location.hash === '#bench'
  window.addEventListener('message', e => {
    if (e.source !== window.parent) return
    const d = e.data
    if (!d || typeof d !== 'object' || d.type !== 'theme:state') return
    mode = d.mode === 'light' ? 'light' : d.mode === 'dark' ? 'dark' : mode
    hostReduced = d.reducedMotion === true
    update()
  })
  document.addEventListener('visibilitychange', () => update())
  if (osReduced && osReduced.addEventListener) osReduced.addEventListener('change', () => update())

  const loadImage = src => new Promise((res, rej) => {
    const im = new Image()
    im.onload = () => res(im)
    im.onerror = rej
    im.src = src
  })

  loadImage(RAIN.src).then(rainImg => {
    const levels = []
    for (let l = 0; l < LEVELS; l++) levels.push(tint(rainImg, rampColor(l / (LEVELS - 1))))
    const lead = tint(rainImg, LEAD)
    layout()
    window.addEventListener('resize', layout)

    const FRAME = 1000 / FPS
    let raf = 0, running = false, last = 0, clock = 0, sinceDraw = 0
    let benchN = 0, benchSum = 0, benchMax = 0

    function frame(ts) {
      if (!running) return
      const dt = Math.min(250, ts - last)
      last = ts
      sinceDraw += dt
      if (sinceDraw >= FRAME - 1) {
        const step = Math.min(250, sinceDraw) / 1000
        clock += step
        sinceDraw = 0
        const t0 = bench ? performance.now() : 0
        const gw = cellW * 1.04 / RAIN.inkW
        const gh = cellH * 0.92 / RAIN.inkH
        ctx.globalCompositeOperation = 'source-over'
        ctx.globalAlpha = 1
        ctx.fillStyle = '#000'
        ctx.fillRect(0, 0, W, H)
        drawRain(step, clock, levels, lead, gw, gh)
        bloom()
        // Redraw lead cores after the bloom so they keep the film's cool white.
        for (let k = 0; k < leads.length; k += 4) {
          ctx.drawImage(lead, leads[k], leads[k + 1], RAIN.cell, RAIN.cell, leads[k + 2], leads[k + 3], gw, gh)
        }
        if (bench) {
          const ms = performance.now() - t0
          benchN++; benchSum += ms; benchMax = Math.max(benchMax, ms)
          if (benchN % 150 === 0) console.log(`bench frames=${benchN} avg=${(benchSum / benchN).toFixed(2)}ms max=${benchMax.toFixed(2)}ms`)
        }
      }
      raf = requestAnimationFrame(frame)
    }

    update = () => {
      const want = mode === 'dark' && !hostReduced && !(osReduced && osReduced.matches) && !document.hidden
      if (want && !running) {
        running = true
        last = performance.now()
        sinceDraw = FRAME
        raf = requestAnimationFrame(frame)
        canvas.classList.add('on')
      } else if (!want && running) {
        running = false
        cancelAnimationFrame(raf)
      }
      // Light mode and reduced motion show nothing: hide and clear the canvas,
      // so the plain theme background shows. A hidden tab just pauses.
      if (!want && !document.hidden) {
        canvas.classList.remove('on')
        ctx.clearRect(0, 0, W, H)
      }
    }
    update()
  }).catch(() => {})
})()
</script>
</body>
</html>
